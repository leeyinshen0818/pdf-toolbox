[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolbox"
version = "0.1.0"
description = "Offline desktop tools for practical PDF workflows."
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "PyMuPDF>=1.23",
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
pdf-toolbox = "pdf_toolbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
